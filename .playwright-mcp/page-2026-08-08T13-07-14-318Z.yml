      - code [ref=f3e25]: worked/cbm-source/
      - text: 。
    - heading "為什麼做這個案例" [level=2] [ref=f3e26]
    - paragraph [ref=f3e27]: codebase-memory-mcp（CBM）本身就是一個把 codebase 變知識圖譜的工具。用 graphify 再掃一次 CBM 的源碼，有幾個教學價值：
    - list [ref=f3e28]:
      - listitem [ref=f3e29]:
        - strong [ref=f3e30]: 對照兩種工具哲學
        - text: ：graphify 偏向「一鍵互動圖 + 審計報告」，CBM 偏向「15 個 MCP 工具 + 即時查詢」。同一份 C 語料，兩者都能給出節點/邊/社群。
      - listitem [ref=f3e31]:
        - strong [ref=f3e32]: 驗證 CBM 的模組結構
        - text: ：graphify 的社群偵測自然地把 343 個社群對應到 CBM 的模組（Cypher engine、MCP server、Daemon IPC…）——側面驗證 CBM 的架構乾淨度。
      - listitem [ref=f3e33]:
        - strong [ref=f3e34]: meta 示範
        - text: ：看一個「會建知識圖譜的 repo」被另一個工具畫成圖。
