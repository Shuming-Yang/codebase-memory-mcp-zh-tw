    - paragraph [ref=f3e178]: 因為全圖 15,815 節點超過 graphify 的 5,000 節點視覺化上限，自動聚合為社群檢視——這反而是好事：一眼看到整個 CBM 的模組結構與跨模組呼叫。
    - heading "如何重現" [level=2] [ref=f3e179]
    - code [ref=f3e181]: "# 0. 安裝 graphify（PyPI 套件名 graphifyy，雙 y） uv tool install graphifyy # 1. 準備語料（只保留第一方程式碼） git clone https://github.com/DeusData/codebase-memory-mcp.git cbm git -C cbm checkout 2c50c7741ec89dbcf43c2c85e005c0b58a4dbbf3 mkdir corpus && cp -R cbm/src corpus/ && cp -R cbm/tests corpus/ # 2. 跑完整 pipeline（code-only，零 API key） graphify corpus --code-only # 3. 產出在 graphify-out/ # graph.html 互動圖（社群聚合檢視） # graph.json 全量圖資料（15,815 nodes / 61,988 edges） # GRAPH_REPORT.md 審計報告 # 4. 中文化 UI（選擇性） cp graphify-out/graph.html graphify-out/graph-zh.html # 替換 lang=\"en\" → lang=\"zh-Hant\" 及 UI 字串（Search / Node Info / Communities…）"
    - heading "已知限制" [level=2] [ref=f3e182]
    - list [ref=f3e183]:
      - listitem [ref=f3e184]: 語料排除 vendored grammars 與 docs，節點數不代表 CBM 全 repo（2023 檔）。
      - listitem [ref=f3e185]:
        - text: 互動圖是社群聚合檢視，想看單節點細節請用
        - code [ref=f3e186]: graph.json
        - text: 或改掃
        - code [ref=f3e187]: src/
        - text: 單一目錄（193 檔，較可能落在節點級檢視範圍）。
      - listitem [ref=f3e188]: graphify 的社群偵測（Leiden）與 CBM 的 Louvain 演算法不同——數字不直接可比，本頁只做結構對照。
    - generic [ref=f3e189]:
      - strong [ref=f3e190]: 看完這個案例你應該能說出
      - text: ：CBM 的模組邊界在哪、為什麼
      - code [ref=f3e191]: cbm_store_close()
      - text: 是所有模組的生命週期樞紐、以及 graphify 與 CBM 兩種知識圖譜工具的哲學差異。
