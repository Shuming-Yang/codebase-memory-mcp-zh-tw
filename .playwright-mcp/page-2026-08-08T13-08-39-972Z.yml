    - heading "教學方法" [level=2] [ref=f11e42]
    - list [ref=f11e43]:
      - listitem [ref=f11e44]: 中英對照中文口語解說為主文，英文原文與程式碼保留上游原貌（文件頁用可展開的原文、程式碼頁用註解版原始碼）。
      - listitem [ref=f11e45]:
        - text: 程式碼逐函數所有講到的 C 函數一個
        - code [ref=f11e46]: <details>
        - text: 收縮塊（signature + 中文用途 + 關鍵邏輯），核心函數附逐行中文註解；短函數用段落式說明。
      - listitem [ref=f11e47]: 策展而非鏡像13 萬行 C 的 repo 不逐檔翻譯，挑「值得教學」的模組（mcp/store/cypher/cli/pipeline/daemon…）深入講解。
      - listitem [ref=f11e48]: 實機示範收錄真實工具產出（graphify 互動圖、CBM CLI 查詢輸出），訪客可直接操作，並提供可重現步驟。
    - heading "關於 codebase-memory-mcp" [level=2] [ref=f11e49]
    - paragraph [ref=f11e50]: codebase-memory-mcp 是一個用純 C 寫的高效能 code intelligence MCP server：用 tree-sitter（158 語系）+ Hybrid LSP 型別解析，把 repo 在毫秒級索引成持久化知識圖譜，提供 15 個 MCP 工具讓 agent 用「問結構問題」取代逐檔 grep。單一靜態二進位、零依賴、100% 本機處理。
    - list [ref=f11e51]:
