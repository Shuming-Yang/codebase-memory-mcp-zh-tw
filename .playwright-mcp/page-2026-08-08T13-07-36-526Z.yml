          - text: /
          - code [ref=f6e39]: qn
          - text: …）、型別、是否必填。MCP client 靠這份 schema 知道怎麼呼叫。工具的實際執行是
          - code [ref=f6e40]: switch
          - text: 或查表分派到對應 handler。
