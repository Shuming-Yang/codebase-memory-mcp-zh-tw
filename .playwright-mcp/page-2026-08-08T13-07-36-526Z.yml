    - heading "大方向" [level=2] [ref=f6e21]
    - paragraph [ref=f6e22]:
      - code [ref=f6e23]: mcp.c
      - text: 是 CBM 對 MCP client 的門面。它負責：JSON-RPC 2.0 的解析與回覆、15 個工具的 schema 註冊與分派、session 的生命週期、以及 auto-index 的觸發。當你的 agent 呼叫
      - code [ref=f6e24]: search_graph
      - text: ，請求就是在這裡被解包、路由到
      - code [ref=f6e25]: store/
      - text: 或
      - code [ref=f6e26]: cypher/
      - text: ，再包成 JSON-RPC 回覆。
