  - banner [ref=f9e14]:
    - heading "安裝指南" [level=1] [ref=f9e15]
    - generic [ref=f9e16]: 讓 codebase-memory-mcp 在你用的 AI 助手上跑起來
  - generic [ref=f9e17]:
    - generic [ref=f9e18]:
      - strong [ref=f9e19]: 先記住這件事
      - text: ：CBM 是
      - strong [ref=f9e20]: 單一靜態二進位
      - text: ，零依賴、零 API key。裝完重啟你的 coding agent，然後說「Index this project」就開始用了。更新是重跑
      - code [ref=f9e21]: install.sh
      - text: （idempotent），不是從二進位內部更新。
    - heading "Step 1 — 安裝（macOS / Linux）" [level=2] [ref=f9e22]
    - code [ref=f9e24]: "# 標準版（無圖形界面，精簡） curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh | bash # 含 3D 圖形 UI（localhost:9749） curl -fsSL https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.sh | bash -s -- --ui"
    - heading "Step 1' — Windows（PowerShell）" [level=2] [ref=f9e25]
    - code [ref=f9e27]: "# 1. 下載安裝程式 Invoke-WebRequest -Uri https://raw.githubusercontent.com/DeusData/codebase-memory-mcp/main/install.ps1 -OutFile install.ps1 # 2. （建議）檢視指令碼內容 notepad install.ps1 # 3. 解除 Mark-of-the-Web 限制 Unblock-File .\\install.ps1 # 4. 執行 .\\install.ps1"
    - paragraph [ref=f9e28]:
      - text: 若出現執行原則錯誤：先跑
      - code [ref=f9e29]: Set-ExecutionPolicy -Scope Process Bypass
      - text: ，或
      - code [ref=f9e30]: PowerShell -ExecutionPolicy Bypass -File .\install.ps1
      - text: 。SmartScreen 警告 →「更多資訊」→「仍要執行」。
    - heading "Step 2 — 確認安裝" [level=2] [ref=f9e31]
    - code [ref=f9e33]: "codebase-memory-mcp --version # 例如 0.9.0 codebase-memory-mcp cli list_projects # 空的 [] 也正常"
    - heading "Step 3 — 開始使用" [level=2] [ref=f9e34]
    - paragraph [ref=f9e35]:
      - code [ref=f9e36]: install
      - text: 會自動偵測已安裝的 coding agent（Claude Code / Codex / OpenCode / Cursor / Gemini CLI…共 43 個平台）並寫入 MCP 設定。重啟你的 agent，然後：
    - code [ref=f9e38]: 你：幫我 index 這個專案 （agent 呼叫 index_repository(repo_path="/絕對路徑")） 你：誰呼叫了 ProcessOrder？ （agent 呼叫 trace_path(function_name="ProcessOrder", direction="inbound")）
    - heading "安裝選項" [level=2] [ref=f9e39]
    - table [ref=f9e40]:
      - rowgroup [ref=f9e41]:
        - row [ref=f9e42]:
          - columnheader "旗標" [ref=f9e43]
          - columnheader "說明" [ref=f9e44]
        - row [ref=f9e45]:
          - cell [ref=f9e46]:
            - code [ref=f9e47]: "--ui"
          - cell [ref=f9e48]:
            - text: 安裝含 3D 圖形界面（
            - code [ref=f9e49]: codebase-memory-mcp --ui=true --port=9749
            - text: → 開
            - code [ref=f9e50]: http://localhost:9749
            - text: ）
        - row [ref=f9e51]:
          - cell [ref=f9e52]:
            - code [ref=f9e53]: "--skip-config"
          - cell "只要二進位，不設定任何 agent" [ref=f9e54]
        - row [ref=f9e55]:
          - cell [ref=f9e56]:
            - code [ref=f9e57]: "--dir=<path>"
          - cell "指定安裝位置" [ref=f9e58]
    - heading "套件管理器" [level=2] [ref=f9e59]
    - code [ref=f9e61]: "# npm npm install -g codebase-memory-mcp # 含 UI：CBM_VARIANT=ui npm install -g codebase-memory-mcp # PyPI pip install codebase-memory-mcp # 含 UI：CBM_VARIANT=ui pip install codebase-memory-mcp # Homebrew（macOS） brew install codebase-memory-mcp # Arch Linux yay -S codebase-memory-mcp-bin # 其他 scoop install codebase-memory-mcp # Windows winget install codebase-memory-mcp # Windows choco install codebase-memory-mcp # Windows go install github.com/DeusData/codebase-memory-mcp@latest"
    - generic [ref=f9e62]:
      - strong [ref=f9e63]: 注意
      - text: ：npm/PyPI/Go 套件只是「發佈該套件的私有快取二進位」，不會取代 native 安裝；執行時仍會進入 exact-build admission barrier。套件管理器的更新用你的套件管理器（
      - code [ref=f9e64]: npm i -g codebase-memory-mcp@latest
      - text: /
      - code [ref=f9e65]: pip install -U codebase-memory-mcp
      - text: ）。
    - heading "從原始碼建置" [level=2] [ref=f9e66]
    - code [ref=f9e68]: "git clone https://github.com/DeusData/codebase-memory-mcp.git cd codebase-memory-mcp scripts/build.sh # 標準版 scripts/build.sh --with-ui # 含圖形界面 # 二進位在 build/c/codebase-memory-mcp"
    - paragraph [ref=f9e69]:
      - text: 需求：C 編譯器（gcc/clang）、C++ 編譯器、zlib、git。跑測試：
      - code [ref=f9e70]: scripts/test.sh
      - text: （6,768 tests / 120 suites）。
    - heading "手動 MCP 設定（不想用 install 指令）" [level=2] [ref=f9e71]
    - paragraph [ref=f9e72]:
      - text: 加到
      - code [ref=f9e73]: ~/.claude.json
      - text: （或專案
      - code [ref=f9e74]: .mcp.json
      - text: ）：
    - code [ref=f9e76]: "{ \"mcpServers\": { \"codebase-memory-mcp\": { \"command\": \"/path/to/codebase-memory-mcp\", \"args\": [] } } }"
    - heading "更新與移除" [level=2] [ref=f9e77]
    - code [ref=f9e79]: "# 更新：重跑安裝指令碼（idempotent）就是更新 bash \"<install-dir>/install.sh\" # macOS/Linux powershell -File \"<install-dir>\\install.ps1\" # Windows # 移除 codebase-memory-mcp uninstall"
    - paragraph [ref=f9e80]: CBM 不會自行檢查新版本、不會發送任何網路請求。更新一律透過 install 指令碼 / 套件管理器 / GitHub releases。
    - heading "疑難排解" [level=2] [ref=f9e81]
    - table [ref=f9e82]:
      - rowgroup [ref=f9e83]:
        - row [ref=f9e84]:
          - columnheader "問題" [ref=f9e85]
          - columnheader "解決方式" [ref=f9e86]
        - row [ref=f9e87]:
          - cell [ref=f9e88]:
            - code [ref=f9e89]: /mcp
            - text: 看不到 server
          - cell [ref=f9e90]:
            - text: 確認
            - code [ref=f9e91]: .mcp.json
            - text: 路徑是絕對路徑，重啟 agent。測試：
            - code [ref=f9e92]: "echo '{}' | /path/to/binary"
            - text: 應輸出 JSON
        - row [ref=f9e93]:
          - cell [ref=f9e94]:
            - code [ref=f9e95]: index_repository
            - text: 失敗
          - cell [ref=f9e96]:
            - text: 傳絕對路徑：
            - code [ref=f9e97]: index_repository(repo_path="/absolute/path")
        - row [ref=f9e98]:
          - cell [ref=f9e99]:
            - code [ref=f9e100]: trace_path
            - text: 回 0 筆
          - cell [ref=f9e101]:
            - text: 先
            - code [ref=f9e102]: search_graph(name_pattern=".*PartialName.*")
            - text: 找出精確名稱
        - row [ref=f9e103]:
          - cell "查詢到錯的專案" [ref=f9e104]
          - cell [ref=f9e105]:
            - text: 加
            - code [ref=f9e106]: project="name"
            - text: 參數；用
            - code [ref=f9e107]: list_projects
            - text: 看名稱
        - row [ref=f9e108]:
          - cell "找不到二進位" [ref=f9e109]
          - cell [ref=f9e110]:
            - code [ref=f9e111]: export PATH="$HOME/.local/bin:$PATH"
        - row [ref=f9e112]:
          - cell "UI 沒載入" [ref=f9e113]
          - cell [ref=f9e114]:
            - text: 確認下載的是
            - code [ref=f9e115]: ui
            - text: 變體且跑了
            - code [ref=f9e116]: "--ui=true"
            - text: ，檢查
            - code [ref=f9e117]: http://localhost:9749
    - paragraph [ref=f9e118]:
      - text: 完整平台矩陣（43 agent）見
      - link "Multi-Agent 支援" [ref=f9e119] [cursor=pointer]:
        - /url: docs/multi-agent.html
      - text: 。
